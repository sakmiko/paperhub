<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperHub — 学术论文搜索平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== Reset & Base ===== */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2235;
            --bg-card-hover: #1f2a42;
            --bg-input: #0f172a;
            --border: #1e3a5f;
            --border-focus: #3b82f6;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-light: #60a5fa;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --accent-gradient-2: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6);
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
            --shadow: 0 4px 24px rgba(0,0,0,0.3);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
            --radius: 12px;
            --radius-sm: 8px;
            --radius-lg: 16px;
        }

        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* ===== Header ===== */
        .header {
            position: relative;
            padding: 60px 20px 40px;
            text-align: center;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(59,130,246,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .header h1 {
            position: relative;
            font-size: 3em;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: var(--accent-gradient-2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .subtitle {
            position: relative;
            color: var(--text-secondary);
            font-size: 1.05em;
            margin-top: 8px;
            font-weight: 400;
        }
        .header .badges {
            position: relative;
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 500;
            background: rgba(59,130,246,0.1);
            color: var(--accent-light);
            border: 1px solid rgba(59,130,246,0.2);
        }
        .badge.green { background: rgba(34,197,94,0.1); color: #4ade80; border-color: rgba(34,197,94,0.2); }
        .badge.purple { background: rgba(139,92,246,0.1); color: #a78bfa; border-color: rgba(139,92,246,0.2); }

        /* ===== Container ===== */
        .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

        /* ===== Search Box ===== */
        .search-section {
            margin: 0 auto 32px;
            animation: slideUp 0.5s ease;
        }
        .search-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow);
            transition: border-color 0.3s;
        }
        .search-box:focus-within { border-color: var(--border-focus); }

        .search-row {
            display: flex;
            gap: 12px;
        }
        .search-row input {
            flex: 1;
            padding: 14px 20px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 1em;
            font-family: inherit;
            outline: none;
            transition: all 0.3s;
        }
        .search-row input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .search-row input::placeholder { color: var(--text-muted); }

        .search-row button {
            padding: 14px 32px;
            border: none;
            border-radius: var(--radius);
            background: var(--accent-gradient);
            color: #fff;
            font-size: 1em;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
        }
        .search-row button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(59,130,246,0.4);
        }
        .search-row button:active { transform: translateY(0); }

        /* ===== Filters ===== */
        .filters {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters select, .filters input {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            background: var(--bg-input);
            color: var(--text-secondary);
            font-size: 0.85em;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            min-width: 0;
        }
        .filters select:focus, .filters input:focus {
            border-color: var(--accent);
        }
        .filters input[type="number"] { width: 80px; }
        .filters input[type="text"] { width: 140px; }
        .filters input::placeholder { color: var(--text-muted); }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .filter-group label {
            color: var(--text-muted);
            font-size: 0.8em;
            font-weight: 500;
        }

        .transport-toggle {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border: 1px solid var(--border);
            border-radius: 20px;
            background: var(--bg-input);
            cursor: pointer;
            font-size: 0.85em;
            color: var(--text-secondary);
            transition: all 0.3s;
            user-select: none;
        }
        .transport-toggle:hover { border-color: var(--accent); }
        .transport-toggle.active {
            background: rgba(59,130,246,0.15);
            border-color: var(--accent);
            color: var(--accent-light);
        }
        .transport-toggle input { display: none; }
        .transport-toggle .icon { font-size: 1.1em; }

        /* ===== Results ===== */
        .results-section { animation: slideUp 0.4s ease; }
        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 4px;
        }
        .results-count {
            color: var(--text-secondary);
            font-size: 0.9em;
            font-weight: 500;
        }
        .results-count strong { color: var(--text-primary); }

        .result-card {
            background: var(--bg-card);
            border: 1px solid transparent;
            border-radius: var(--radius);
            padding: 20px 24px;
            margin-bottom: 10px;
            transition: all 0.3s;
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        .result-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 100%;
            background: var(--accent-gradient);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .result-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(59,130,246,0.15);
            transform: translateX(4px);
        }
        .result-card:hover::before { opacity: 1; }

        .result-card .title {
            font-size: 1em;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 8px;
        }
        .result-card .title a {
            color: var(--accent-light);
            text-decoration: none;
        }
        .result-card .title a:hover { text-decoration: underline; }

        .result-card .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 0.82em;
            color: var(--text-secondary);
        }
        .result-card .meta span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .result-card .meta .authors {
            color: var(--text-muted);
        }
        .result-card .meta .doi {
            color: var(--accent-light);
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9em;
        }

        .result-card .platform-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.72em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: rgba(59,130,246,0.1);
            color: var(--accent-light);
        }

        .result-card .actions {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            flex-wrap: wrap;
        }
        .result-card .actions button {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.8em;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .result-card .actions button:hover {
            background: rgba(59,130,246,0.1);
            border-color: var(--accent);
            color: var(--accent-light);
        }
        .result-card .actions .download-btn {
            border-color: var(--success);
            color: var(--success);
        }
        .result-card .actions .download-btn:hover {
            background: rgba(34,197,94,0.1);
            border-color: var(--success);
        }

        .result-card .summary-box {
            margin-top: 10px;
            padding: 14px 16px;
            background: rgba(15,23,42,0.6);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.85em;
            color: var(--text-secondary);
            line-height: 1.7;
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .result-card .summary-box .provider-badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 4px;
            font-size: 0.7em;
            font-weight: 600;
            background: rgba(139,92,246,0.15);
            color: #a78bfa;
            margin-right: 6px;
        }

        /* ===== Loading ===== */
        .loading-state {
            text-align: center;
            padding: 60px 20px;
        }
        .loading-state .spinner {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-state p {
            color: var(--text-muted);
            font-size: 0.9em;
        }

        .loading-skeleton {
            padding: 20px 24px;
            margin-bottom: 10px;
        }
        .loading-skeleton .skeleton-line {
            height: 16px;
            border-radius: 4px;
            background: linear-gradient(90deg, var(--bg-card) 0%, var(--bg-card-hover) 50%, var(--bg-card) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            margin-bottom: 8px;
        }
        .loading-skeleton .skeleton-line:first-child { width: 70%; height: 20px; }
        .loading-skeleton .skeleton-line:nth-child(2) { width: 50%; }
        .loading-skeleton .skeleton-line:nth-child(3) { width: 90%; }

        /* ===== Empty State ===== */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }
        .empty-state .icon {
            font-size: 4em;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        .empty-state h3 {
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 1.1em;
        }
        .empty-state p {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-top: 8px;
        }

        /* ===== Error State ===== */
        .error-state {
            text-align: center;
            padding: 40px 20px;
            background: rgba(239,68,68,0.05);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: var(--radius);
        }
        .error-state .icon { font-size: 2.5em; margin-bottom: 12px; }
        .error-state p {
            color: var(--error);
            font-size: 0.9em;
        }

        /* ===== Toast ===== */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.85em;
            font-weight: 500;
            color: #fff;
            animation: toastIn 0.3s ease;
            box-shadow: var(--shadow-lg);
            max-width: 360px;
        }
        .toast.success { background: var(--success); }
        .toast.error { background: var(--error); }
        .toast.info { background: var(--accent); }

        /* ===== Animations ===== */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .header h1 { font-size: 2em; }
            .search-row { flex-direction: column; }
            .search-row button { width: 100%; justify-content: center; }
            .filters { flex-direction: column; align-items: stretch; }
            .filters input[type="text"] { width: 100%; }
            .filter-group { width: 100%; }
            .filter-group select { flex: 1; }
            .result-card { padding: 16px; }
            .result-card .meta { flex-direction: column; gap: 4px; }
            .toast-container { left: 16px; right: 16px; bottom: 16px; }
            .toast { max-width: 100%; }
        }

        @media (max-width: 480px) {
            .header { padding: 40px 16px 24px; }
            .header h1 { font-size: 1.6em; }
            .search-box { padding: 16px; }
            .result-card .actions button { flex: 1; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📚 PaperHub</h1>
    <p class="subtitle">一站式学术论文搜索 — 14 平台 · 73 交通期刊 · 引用网络 · AI 摘要</p>
    <div class="badges">
        <span class="badge">⚡ 智能搜索</span>
        <span class="badge green">📥 一键下载</span>
        <span class="badge purple">🔗 引用网络</span>
        <span class="badge">🤖 AI 摘要</span>
    </div>
</div>

<div class="container">
    <!-- Search -->
    <div class="search-section">
        <div class="search-box">
            <div class="search-row">
                <input type="text" id="query" placeholder="输入搜索关键词，如 attention is all you need" autofocus
                       onkeydown="if(event.key==='Enter' && this.value.trim()) search()">
                <button onclick="search()">🔍 搜索</button>
            </div>
            <div class="filters">
                <div class="filter-group">
                    <label>平台</label>
                    <select id="platform">
                        <option value="">全部</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>期刊</label>
                    <input type="text" id="journal" placeholder="模糊匹配 (trr, 交通运输...)" style="width:160px">
                </div>
                <div class="filter-group">
                    <label>年份</label>
                    <input type="number" id="year_from" placeholder="从" min="1900" max="2026" style="width:72px">
                    <span style="color:var(--text-muted)">—</span>
                    <input type="number" id="year_to" placeholder="至" min="1900" max="2026" style="width:72px">
                </div>
                <div class="filter-group">
                    <label>作者</label>
                    <input type="text" id="author" placeholder="作者名" style="width:120px">
                </div>
                <div class="filter-group">
                    <label>条数</label>
                    <select id="limit">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                    </select>
                </div>
                <label class="transport-toggle" id="transportLabel">
                    <input type="checkbox" id="transport">
                    <span class="icon">🚌</span> 交通领域
                </label>
            </div>
        </div>
    </div>

    <!-- Results -->
    <div class="results-section" id="resultsSection">
        <div class="results-header" id="resultsHeader" style="display:none">
            <span class="results-count" id="resultsCount"></span>
        </div>
        <div id="resultsList"></div>
    </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toastContainer"></div>

<script>
    // ===== Platform Load =====
    fetch('/api/platforms').then(r=>r.json()).then(d=>{
        const sel = document.getElementById('platform');
        d.platforms.forEach(p => { sel.innerHTML += `<option value="${p}">${p}</option>`; });
    }).catch(()=>{});

    // ===== Transport Toggle =====
    document.getElementById('transportLabel').addEventListener('click', function(e) {
        if (e.target.type !== 'checkbox') {
            const cb = document.getElementById('transport');
            cb.checked = !cb.checked;
        }
        this.classList.toggle('active', document.getElementById('transport').checked);
    });

    // ===== State =====
    let currentResults = [];

    // ===== Search =====
    async function search() {
        const query = document.getElementById('query').value.trim();
        if (!query) { showToast('请输入搜索关键词', 'info'); return; }

        const list = document.getElementById('resultsList');
        const header = document.getElementById('resultsHeader');
        const count = document.getElementById('resultsCount');

        header.style.display = 'none';
        list.innerHTML = `
            <div class="loading-state">
                <div class="spinner"></div>
                <p>正在搜索 <strong>${escapeHtml(query)}</strong> ...</p>
            </div>
        `;

        const payload = {
            query,
            platforms: document.getElementById('platform').value ? [document.getElementById('platform').value] : [],
            limit: parseInt(document.getElementById('limit').value),
            transport: document.getElementById('transport').checked,
            journal: document.getElementById('journal').value.trim(),
            year_from: document.getElementById('year_from').value || null,
            year_to: document.getElementById('year_to').value || null,
            author: document.getElementById('author').value || null,
        };

        try {
            const resp = await fetch('/api/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload),
            });
            const data = await resp.json();
            if (data.error) {
                list.innerHTML = `<div class="error-state"><div class="icon">❌</div><p>${escapeHtml(data.error)}</p></div>`;
                return;
            }
            currentResults = data.results || [];
            renderResults(currentResults, data.cached);
        } catch(e) {
            list.innerHTML = `<div class="error-state"><div class="icon">⚠️</div><p>请求失败: ${e.message}</p></div>`;
        }
    }

    // ===== Render =====
    function renderResults(results, cached) {
        const list = document.getElementById('resultsList');
        const header = document.getElementById('resultsHeader');
        const count = document.getElementById('resultsCount');

        if (!results.length) {
            list.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📭</div>
                    <h3>未找到相关论文</h3>
                    <p>试试其他关键词或调整过滤条件</p>
                </div>
            `;
            header.style.display = 'none';
            return;
        }

        header.style.display = 'flex';
        count.innerHTML = cached
            ? `📦 缓存结果 · <strong>${results.length}</strong> 篇`
            : `📚 <strong>${results.length}</strong> 篇结果`;

        list.innerHTML = results.map((r, i) => `
            <div class="result-card" style="animation:slideUp 0.3s ease ${i * 0.05}s both">
                <div class="title">${escapeHtml(r.title || '无标题')}</div>
                <div class="meta">
                    ${r.authors?.length ? `<span class="authors">👤 ${escapeHtml(r.authors.slice(0,3).join(', '))}${r.authors.length > 3 ? ` et al.` : ''}</span>` : ''}
                    ${r.year ? `<span>📅 ${r.year}</span>` : ''}
                    ${r.source ? `<span>📰 ${escapeHtml(r.source)}</span>` : ''}
                    ${r.doi ? `<span class="doi">🔗 ${escapeHtml(r.doi)}</span>` : ''}
                    <span class="platform-tag">${r.platform || '?'}</span>
                </div>
                <div class="actions">
                    ${r.doi ? `<button class="download-btn" onclick="downloadPaper('${escapeHtml(r.doi)}')">📥 下载</button>` : ''}
                    ${r.doi ? `<button onclick="showCitations('${escapeHtml(r.doi)}')">🔗 引用</button>` : ''}
                    ${r.abstract ? `<button onclick="toggleSummary(${i})">🤖 摘要</button>` : ''}
                    ${r.url ? `<button onclick="window.open('${escapeHtml(r.url)}','_blank')">🌐 打开</button>` : ''}
                </div>
                <div class="summary-box" id="summary-${i"></div>
            </div>
        `).join('');
    }

    // ===== Download =====
    async function downloadPaper(doi) {
        const btn = event.target;
        btn.textContent = '⏳ 下载中...';
        btn.disabled = true;
        try {
            const resp = await fetch('/api/download', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({doi}),
            });
            const data = await resp.json();
            if (data.success) {
                showToast(`✅ 下载成功: ${data.title?.slice(0, 50) || doi}`, 'success');
            } else {
                showToast(`❌ 下载失败: ${data.error || '所有平台无法下载'}`, 'error');
            }
        } catch(e) {
            showToast('❌ 下载请求失败', 'error');
        }
        btn.textContent = '📥 下载';
        btn.disabled = false;
    }

    // ===== Citations =====
    async function showCitations(doi) {
        showToast('🔗 正在获取引用信息...', 'info');
        try {
            const resp = await fetch(`/api/citation/${encodeURIComponent(doi)}`);
            const data = await resp.json();
            if (data.error) { showToast(`❌ ${data.error}`, 'error'); return; }
            const cites = data.citations?.length || 0;
            const refs = data.references?.length || 0;
            showToast(`📊 被引 ${cites} 篇 · 参考文献 ${refs} 篇`, 'info');
        } catch(e) {
            showToast('❌ 引用查询失败', 'error');
        }
    }

    // ===== Summary =====
    async function toggleSummary(index) {
        const r = currentResults[index];
        const box = document.getElementById(`summary-${index}`);
        if (!box) return;

        if (box.style.display === 'block') {
            box.style.display = 'none';
            return;
        }

        box.style.display = 'block';
        box.innerHTML = '<div style="text-align:center;padding:10px"><div class="spinner" style="width:24px;height:24px;margin:0 auto;border-width:2px"></div><p style="margin-top:8px;font-size:0.85em;color:var(--text-muted)">AI 生成中...</p></div>';

        try {
            const resp = await fetch('/api/summary', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({title: r.title, abstract: r.abstract, doi: r.doi}),
            });
            const data = await resp.json();
            if (data.summary) {
                box.innerHTML = `<span class="provider-badge">${data.provider || 'LLM'}</span>${escapeHtml(data.summary)}`;
            } else {
                box.innerHTML = '<span style="color:var(--text-muted)">❌ LLM 未配置，设置环境变量 LLM_API_KEY</span>';
            }
        } catch(e) {
            box.innerHTML = '<span style="color:var(--error)">❌ 请求失败</span>';
        }
    }

    // ===== Toast =====
    function showToast(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transition = 'opacity 0.3s';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // ===== Utility =====
    function escapeHtml(text) {
        if (!text) return '';
        const d = document.createElement('div');
        d.textContent = text;
        return d.innerHTML;
    }
</script>
</body>

version: "3.8"

services:
  paperhub:
    build: .
    image: paperhub:latest
    container_name: paperhub
    command: search "attention" --all --limit 5
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - paperhub_downloads:/root/paper-downloads
    environment:
      - CORE_API_KEY=${CORE_API_KEY:-}
      - BOHRIUM_API_KEY=${BOHRIUM_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  paperhub-web:
    build: .
    image: paperhub:latest
    container_name: paperhub-web
    command: python -m web.app
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - paperhub_downloads:/root/paper-downloads
    environment:
      - CORE_API_KEY=${CORE_API_KEY:-}
      - BOHRIUM_API_KEY=${BOHRIUM_API_KEY:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

volumes:
  paperhub_downloads:
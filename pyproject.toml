[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "paperhub"
version = "0.1.0"
description = "PaperHub - Academic paper downloader and manager"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "sakmiko"},
]

dependencies = [
    "requests>=2.28.0",
]

[project.scripts]
paperhub = "main:main"

[tool.setuptools.packages.find]
include = ["paperhub*"]